<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>
        <label for="courses">Courses:</label>
        <select id="courses" name="courses">
            <option value="">Select a course</option>
            <option value="BBA">BBA</option>
            <option value="BCA">BCA</option>
            <option value="BSC">BSC CS</option>
            <option value="BTECH">BTECH</option>
            <option value="MCA">MCA</option>
            <option value="MSC">MSC CS</option>
            <option group label="MBA">
                <option value="MBA">MBA</option>
                <option value="MBA Finance">MBA Finance</option>
                <option value="MBA Marketing">MBA Marketing</option>
            </option>
        </select>
        <br><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="50" required></textarea>
        <br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="hobbies" name="hobbies" value="reading">
        <label for="hobbies">Reading</label>
        <input type="checkbox" id="hobbies2" name="hobbies" value="sports">
        <label for="hobbies2">Sports</label>
        <input type="checkbox" id="hobbies3" name="hobbies" value="music">
        <label for="hobbies3">Music</label>
        <br><br>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
        <br><br>
        <input type="submit" value="Register">
        <input type="reset" id="reset" value="Reset">
        <label for="reset">Reset</label>
    </form>
</body>
</html>
